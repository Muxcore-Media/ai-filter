# Canonical golangci-lint v2 config for MuxCore sidecar modules.

version: "2"

run:
  timeout: 120s

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
